[package]
name = "coconut"
version = "0.2.0"
description = "Local-first WYSIWYG Markdown editor. Your files stay on disk."
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/xigua222/Coconut"
homepage = "https://github.com/xigua222/Coconut"

[lib]
name = "coconut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.31"
chardetng = "0.1"
encoding_rs = "0.8"
base64 = "0.21"
tantivy = "0.24"
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
# 四项合计能把二进制再压 30-40%
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
